name: Daily Multibagger Scan

on:
  schedule:
    # Runs at 10:05 UTC = 3:35 PM IST, Mon–Fri (market close)
    - cron: "5 10 * * 1-5"
  workflow_dispatch:   # allows manual trigger from GitHub UI anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run scanner
        env:
          GMAIL_USER:            ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:        ${{ secrets.GMAIL_APP_PASS }}
          ALERT_EMAIL:           ${{ secrets.ALERT_EMAIL }}
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_SID:            ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:          ${{ secrets.TWILIO_TOKEN }}
          TWILIO_WHATSAPP_FROM:  ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO:    ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: python scanner.py

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signals-${{ github.run_id }}
          path: logs/signals_*.csv
          retention-days: 90

      - name: Upload log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanlog-${{ github.run_id }}
          path: logs/scanner.log
          retention-days: 30
