name: Test BBOX Report Compile

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-test-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Compile BBOX Report
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        CONFLUENCE_MODEL: ${{ secrets.CONFLUENCE_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
        EMERGING_MODEL: ${{ secrets.EMERGING_MODEL }}
        FALLBACK_MODELS: ${{ secrets.FALLBACK_MODELS }}
      run: |
        python -u scratch/compile_cdsl.py

    - name: Commit and Push Generated Report
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git rebase --abort 2>/dev/null || true
        rm -rf .git/rebase-merge .git/rebase-apply
        [ -d "outputs/reports" ] && git add -f outputs/reports/ || echo "No reports directory"
        git diff --staged --quiet || (git commit -m "chore: auto-push BBOX test report [skip ci]" && git pull --rebase --autostash origin main && git push)
