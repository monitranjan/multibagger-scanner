name: Test BBOX Report Compile

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-test-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Compile BBOX Report
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        CONFLUENCE_MODEL: ${{ vars.CONFLUENCE_MODEL || secrets.CONFLUENCE_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
        EMERGING_MODEL: ${{ vars.EMERGING_MODEL || secrets.EMERGING_MODEL }}
        FALLBACK_MODELS: ${{ vars.FALLBACK_MODELS || secrets.FALLBACK_MODELS }}
        SUMMARIZATION_MODEL: ${{ vars.SUMMARIZATION_MODEL || secrets.SUMMARIZATION_MODEL }}
      run: |
        python -u scratch/compile_cdsl.py

    - name: Commit and Push Generated Report
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git rebase --abort 2>/dev/null || true
        rm -rf .git/rebase-merge .git/rebase-apply
        [ -d "outputs/reports" ] && git add -f outputs/reports/ || echo "No reports directory"
        [ -d "outputs/intermediate_summaries" ] && git add -f outputs/intermediate_summaries/ || echo "No intermediate summaries directory"
        if ! git diff --staged --quiet; then
          git commit -m "chore: auto-push BBOX test report and intermediate summaries [skip ci]"
          for i in {1..5}; do
            echo "Attempt $i to sync and push..."
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "Successfully synced and pushed BBOX report!"
              break
            fi
            echo "Attempt $i failed. Resolving any conflict residuals and retrying in 5s..."
            if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
              for ufile in $(git diff --name-only --diff-filter=U 2>/dev/null); do
                git checkout --theirs "$ufile" 2>/dev/null || true
                git add "$ufile" 2>/dev/null || true
              done
              git -c core.editor=true rebase --continue 2>/dev/null || git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
        fi
