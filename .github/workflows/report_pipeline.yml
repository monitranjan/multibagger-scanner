name: Automated Deep Equity Reports Pipeline

on:
  schedule:
    # Run Monday through Friday at 10:52 AM UTC (which is 4:22 PM IST, 30 minutes after the main pipeline)
    - cron: '52 10 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually from GitHub website with 1 click

jobs:
  run-report-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Generate Deep Equity Research Reports
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      run: |
        # Run decoupled report generator to fetch, evaluate, and write Wheels-style reports
        python -u generate_equity_reports.py

    - name: Commit and Push Newly Compiled Reports
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Force add newly generated reports/markdowns if they exist, bypassing .gitignore
        [ -d "outputs/reports" ] && git add -f outputs/reports/ || echo "No reports directory found to sync"
        # Commit only if changes exist
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-publish newly compiled equity reports [skip ci]" && git pull --rebase --autostash origin main && git push)
