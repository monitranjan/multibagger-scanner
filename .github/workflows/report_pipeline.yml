name: Confluence Match Reports Pipeline

on:
  workflow_run:
    workflows: ["Daily Multibagger Pipeline"]
    types:
      - completed
  workflow_dispatch: # Allows you to trigger it manually from GitHub website with 1 click

jobs:
  run-report-pipeline:
    runs-on: ubuntu-latest
    concurrency:
      group: confluence-reports-pipeline
      cancel-in-progress: false
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Generate Deep Equity Research Reports
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        CONFLUENCE_MODEL: ${{ vars.CONFLUENCE_MODEL }}
        FALLBACK_MODELS: ${{ vars.FALLBACK_MODELS }}
        SUMMARIZATION_MODEL: ${{ vars.CONFLUENCE_SUMMARIZING_MODEL }}
        TAVILY_API_KEY: ${{ secrets.TRAVILY_API_KEY }}
        STOCKSCANS_COOKIE: ${{ secrets.STOCKSCANS_COOKIE }}
        REPORT_TYPE: confluence
      run: |
        # Run decoupled report generator to fetch, evaluate, and write Wheels-style reports
        python -u generate_equity_reports.py

    - name: Commit and Push Newly Compiled Reports
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Clean up any stale rebase state from previous runs
        git rebase --abort 2>/dev/null || true
        rm -rf .git/rebase-merge .git/rebase-apply
        # Force add newly generated reports/markdowns if they exist, bypassing .gitignore
        [ -d "outputs/reports" ] && git add -f outputs/reports/ || echo "No reports directory found to sync"
        [ -d "outputs/intermediate_summaries" ] && git add -f outputs/intermediate_summaries/ || echo "No intermediate summaries directory found to sync"
        # Commit only if changes exist
        if ! git diff --staged --quiet; then
          git commit -m "chore: auto-publish newly compiled equity reports and intermediate summaries [skip ci]"
          for i in {1..5}; do
            echo "Attempt $i to sync and push..."
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "Successfully synced and pushed reports!"
              break
            fi
            echo "Attempt $i failed. Resolving any conflict residuals and retrying in 5s..."
            if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
              for ufile in $(git diff --name-only --diff-filter=U 2>/dev/null); do
                git checkout --theirs "$ufile" 2>/dev/null || true
                git add "$ufile" 2>/dev/null || true
              done
              git -c core.editor=true rebase --continue 2>/dev/null || git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
        fi
