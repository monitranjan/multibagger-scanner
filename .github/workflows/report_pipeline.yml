name: Automated Deep Equity Reports Pipeline

on:
  workflow_run:
    workflows: ["Daily Multibagger Pipeline"]
    types:
      - completed
  workflow_dispatch: # Allows you to trigger it manually from GitHub website with 1 click

jobs:
  run-report-pipeline:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Generate Deep Equity Research Reports
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        CONFLUENCE_MODEL: ${{ secrets.CONFLUENCE_MODEL }}
        EMERGING_MODEL: ${{ secrets.EMERGING_MODEL }}
        FALLBACK_MODELS: ${{ secrets.FALLBACK_MODELS }}
      run: |
        # Run decoupled report generator to fetch, evaluate, and write Wheels-style reports
        python -u generate_equity_reports.py

    - name: Commit and Push Newly Compiled Reports
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Clean up any stale rebase state from previous runs
        git rebase --abort 2>/dev/null || true
        rm -rf .git/rebase-merge .git/rebase-apply
        # Force add newly generated reports/markdowns if they exist, bypassing .gitignore
        [ -d "outputs/reports" ] && git add -f outputs/reports/ || echo "No reports directory found to sync"
        # Commit only if changes exist
        git diff --staged --quiet || (git commit -m "chore: auto-publish newly compiled equity reports [skip ci]" && git pull --rebase --autostash origin main && git push)
