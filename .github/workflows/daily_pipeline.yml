name: Daily Multibagger Pipeline

on:
  schedule:
    # Run daily at 12:00 PM UTC (which is 5:30 PM IST)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub website with 1 click

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Daily Pipeline
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        TWILIO_SID: ${{ secrets.TWILIO_SID }}
        TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
        TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
        TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
      run: |
        # 1. Run scanner to fetch active signals
        python scanner.py
        # 2. Run ranker to compute database analytics, send documents, and compile the Excel sheet
        python monit_ranker.py

    - name: Commit and Push Database Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Force add database file
        git add logs/backtest.db
        # Commit only if changes exist
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync backtest database [skip ci]" && git pull --rebase origin main && git push)
