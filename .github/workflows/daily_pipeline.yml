name: Daily Multibagger Pipeline

on:
  schedule:
    # Run Monday through Friday at 10:22 AM UTC (which is 3:52 PM IST, right after market close)
    - cron: '22 10 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually from GitHub website with 1 click

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Daily Pipeline
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        TWILIO_SID: ${{ secrets.TWILIO_SID }}
        TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
        TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
        TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
        STOCKSCANS_COOKIE: ${{ secrets.STOCKSCANS_COOKIE }}
      run: |
        # 1. Run scanner to fetch active signals
        python -u scanner.py
        # 2. Run ranker to compute database analytics, send documents, and compile the Excel sheet
        python -u monit_ranker.py

    - name: Commit and Push Database and Generated Reports
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Force add database file and newly generated reports/markdowns
        git add -f logs/backtest.db outputs/
        # Commit only if changes exist
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync database and confluence reports [skip ci]" && git pull --rebase --autostash origin main && git push)
